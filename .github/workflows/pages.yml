name: Deploy Atlas México
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Resolve destination coordinates']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Build isolated Google Maps preview
        continue-on-error: true
        run: |
          git fetch origin geo-validation
          git worktree add --detach /tmp/atlas-preview origin/geo-validation
          cd /tmp/atlas-preview
          npm install --no-audit --no-fund
          npm test
          npm run build -- --base=/atlas-mexico/preview/
          mkdir -p "$GITHUB_WORKSPACE/dist/preview"
          cp -a dist/. "$GITHUB_WORKSPACE/dist/preview/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
