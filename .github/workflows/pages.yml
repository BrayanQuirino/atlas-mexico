name: Deploy Atlas México
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Resolve destination coordinates', 'Google Places ID validation']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build with restricted browser key
        env:
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ vars.GOOGLE_MAPS_BROWSER_KEY || secrets.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_BROWSER_KEY" ]; then
            echo '::error::Repository variable or secret GOOGLE_MAPS_BROWSER_KEY is missing'
            exit 1
          fi
          npm run build
      - name: Verify production bundle
        run: |
          test -f dist/index.html
          grep -R -l 'maps.googleapis.com/maps/api/js' dist/assets >/dev/null
          printf '%s\n' "$(git rev-parse HEAD)" > dist/version.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
