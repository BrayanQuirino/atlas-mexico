name: Google Places ID validation
on:
  push:
    branches: [main]
    paths: ['scripts/google-place-ids.mjs']
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum requests'
        type: number
        default: 292
permissions:
  contents: write
concurrency:
  group: google-place-validation
  cancel-in-progress: false
jobs:
  lookup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One request per destination
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LOOKUP_LIMIT: ${{ inputs.limit || 292 }}
        run: node scripts/google-place-ids.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-coordinates
          path: public/google-coordinates.json
          retention-days: 29
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-id-report
          path: google-id-report.json
      - name: Save only permanent identifiers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f google-id-report.json || exit 0
          git add src/data/places.json google-id-report.json
          git diff --cached --quiet || git commit -m "Save Google Place IDs"
          git push origin HEAD:main
